name: CPU Serial

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
    branches: ["master"]

concurrency:
  # Give each PR a unique concurrency group 
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}-${{ contains(github.event.pull_request.labels.*.name, 'compile-ci') && github.event.pull_request.draft == false && (github.event.action != 'labeled' || github.event.label.name == 'compile-ci') && 'ci' || github.run_id }}
  cancel-in-progress: true

jobs:
  # ===== BUILD + UNIT TESTS =====
  build:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    if: >
      contains(github.event.pull_request.labels.*.name, 'compile-ci') &&
      github.event.pull_request.draft == false &&
      (github.event.action != 'labeled' || github.event.label.name == 'compile-ci')

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gfortran cmake git lcov \
            libopenmpi-dev openmpi-bin gcovr

      - name: Configure CMake
        run: |
          mkdir -p build_serial
          cd build_serial
          cmake .. \
            -DCMAKE_BUILD_TYPE=Debug \
            -DPLATFORMS=SERIAL \
            -DOPALX_ENABLE_UNIT_TESTS=ON

      - name: Build
        run: |
          cd build_serial
          make -j$(nproc)

      - name: Run unit tests
        run: |
          cd build_serial
          ctest --output-on-failure -j $(nproc)

      - name: Upload binary for smoke tests
        uses: actions/upload-artifact@v4
        with:
          name: opalx-serial-debug
          path: build_serial/src/opalx

  # ===== SMOKE REGRESSION TESTS =====
  # Edit the list below to add or remove tests.
  # Each entry must be a folder name under RegressionTests/ in the
  # regression-tests-x repository. The folder must contain:
  #   <name>.in        — OPALX input file
  #   <name>.rt        — assertions: stat "col" last|avg <tol>
  #   reference/       — reference outputs including <name>.stat
  smoke-tests:
    name: Smoke Test (${{ matrix.test }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - Drift-1-fromfile
          - Drift-4-multi-emit-open
          - FodoCell-fromfile
          - BeamBeam-OffsetKick
          - BeamBeam-TimedBirths
          - BeamBeam-WitnessMPI
          - BeamBeam-RigidSource

    steps:
      - name: Install MPI runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin libgfortran5

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: opalx-serial-debug
          path: bin

      - name: Make binary executable
        run: chmod +x bin/opalx

      - name: Get regression test inputs
        run: |
          git clone --depth=1 https://github.com/OPALX-project/regression-tests-x.git

      - name: Run ${{ matrix.test }}
        run: |
          TEST_DIR=regression-tests-x/RegressionTests/${{ matrix.test }}
          RUN_DIR=run_${{ matrix.test }}
          mkdir -p "$RUN_DIR"
          find "$TEST_DIR" -maxdepth 1 -type f -exec cp {} "$RUN_DIR/" \;
          cd "$RUN_DIR"
          if [[ "${{ matrix.test }}" == BeamBeam-* ]]; then
            # These existing-architecture launchers select the witness/primary
            # stat file verbatim. MPI cases use at most four ranks, one thread each.
            export OPALX_EXE_PATH="$GITHUB_WORKSPACE/bin"
            timeout 30s bash "${{ matrix.test }}.local"
          else
            mpirun -np 1 "$GITHUB_WORKSPACE/bin/opalx" ${{ matrix.test }}.in --info 2
          fi

      - name: Compare stat output to reference (${{ matrix.test }})
        env:
          TEST_NAME: ${{ matrix.test }}
        run: |
          python3 << 'PYEOF'
          import sys, os, math

          test = os.environ['TEST_NAME']

          def parse_sdds(path):
              with open(path) as f:
                  lines = f.readlines()
              cols, n_params, data_end_idx, section = [], 0, None, None
              for i, line in enumerate(lines):
                  s = line.strip()
                  if s.startswith('&') and s != '&end':
                      section = s[1:]
                      if section == 'parameter':
                          n_params += 1
                  elif s == '&end':
                      if section == 'data':
                          data_end_idx = i + 1
                      section = None
                  elif section == 'column' and s.startswith('name='):
                      cols.append(s.split('name=')[1].split(',')[0].strip().strip('"'))
              rows = [
                  [v.strip() for v in l.strip().split('\t')]
                  for l in lines[data_end_idx + n_params:]
                  if l.strip()
              ]
              return cols, rows

          def stat_value(cols, rows, col, agg):
              j = cols.index(col)
              vals = [float(row[j]) for row in rows]
              if agg == 'last':
                  return vals[-1]
              if agg == 'avg':
                  return sum(vals) / len(vals)
              raise ValueError(f'Unknown aggregation type: {agg}')

          def parse_rt(path):
              checks = []
              with open(path) as f:
                  for line in f:
                      line = line.split('#')[0].strip()
                      parts = line.split()
                      if len(parts) >= 4 and parts[0] == 'stat':
                          checks.append((parts[1].strip('"'), parts[2], float(parts[3])))
              return checks

          ref_cols, ref_rows = parse_sdds(f'regression-tests-x/RegressionTests/{test}/reference/{test}.stat')
          got_cols, got_rows = parse_sdds(f'run_{test}/{test}.stat')
          checks = parse_rt(f'regression-tests-x/RegressionTests/{test}/{test}.rt')
          with open(f'regression-tests-x/RegressionTests/{test}/{test}.rt') as f:
              absolute = '[tolerance: absolute]' in f.readline()
          if not checks or not ref_rows or not got_rows:
              raise ValueError('A regression requires assertions and nonempty outputs')
          if absolute and len(ref_rows) != len(got_rows):
              raise ValueError('Incomplete trajectory: output/reference row counts differ')

          print(f'Checking {len(checks)} assertion(s) from {test}.rt ({len(got_rows)} time steps)')
          failed = False
          for col, agg, tol in checks:
              rv = [float(row[ref_cols.index(col)]) for row in ref_rows]
              gv = [float(row[got_cols.index(col)]) for row in got_rows]
              if not all(math.isfinite(v) for v in rv + gv):
                  raise ValueError(f'Nonfinite checked column: {col}')
              r = stat_value(ref_cols, ref_rows, col, agg)
              g = stat_value(got_cols, got_rows, col, agg)
              if absolute:
                  # Match NightlyBuildX StatTest: last absolute error, or
                  # sqrt(sum(pointwise squared errors))/N for its 'avg' mode.
                  error = (abs(g - r) if agg == 'last' else
                           math.sqrt(sum((a-b)**2 for a, b in zip(gv, rv))) / len(rv))
              else:
                  error = abs(g - r) / (abs(r) + 1e-30)
              status = 'PASS' if error < tol else 'FAIL'
              if status == 'FAIL':
                  failed = True
              mode = 'abs' if absolute else 'rel'
              print(f'  [{status}] {col} ({agg}): ref={r:.15e}  got={g:.15e}  {mode}_err={error:.2e}  tol={tol:.0e}')

          sys.exit(1 if failed else 0)
          PYEOF
