name: CPU Serial

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: ["master"]

# Runs on every non-draft PR. Every event on the PR replaces its previous run, so only
# the newest commit is built.
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ===== BUILD + UNIT TESTS =====
  # Required check for merging into master. GitHub counts a skipped job as passed, so the
  # only skip condition is a draft PR (which cannot be merged), and no label event starts
  # this workflow.
  build:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gfortran cmake git lcov \
            libopenmpi-dev openmpi-bin gcovr

      - name: Configure CMake
        run: |
          mkdir -p build_serial
          cd build_serial
          cmake .. \
            -DCMAKE_BUILD_TYPE=Debug \
            -DPLATFORMS=SERIAL \
            -DOPALX_ENABLE_UNIT_TESTS=ON

      - name: Build
        run: |
          cd build_serial
          make -j$(nproc)

      - name: Run unit tests
        run: |
          cd build_serial
          ctest --output-on-failure -j $(nproc)
