name: CPU OpenMP

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
    branches: ["master"]

# Runs only on non-draft PRs with the smoke-compile-checks label. Every event on the PR
# replaces its previous run, so only the newest commit is built. Adding or removing any
# other label gets its own group and cannot cancel a running check.
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}-${{ ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'smoke-compile-checks') && 'ci' || github.run_id }}
  cancel-in-progress: true

jobs:
  # ===== BUILD + UNIT TESTS =====
  # Not named "Build & Unit Tests": the master ruleset requires that check by job name,
  # and it must refer to CPU Serial only.
  build:
    name: OpenMP Build & Unit Tests
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'smoke-compile-checks') &&
      github.event.action != 'unlabeled' &&
      (github.event.action != 'labeled' || github.event.label.name == 'smoke-compile-checks')

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gfortran cmake git \
            libopenmpi-dev openmpi-bin \
            libomp-dev

      - name: Configure CMake
        run: |
          mkdir -p build_openmp
          cd build_openmp
          cmake .. \
            -DCMAKE_BUILD_TYPE=Debug \
            -DPLATFORMS=OPENMP \
            -DOPALX_ENABLE_UNIT_TESTS=ON

      - name: Build
        run: |
          cd build_openmp
          make -j$(nproc)

      - name: Run unit tests
        run: |
          cd build_openmp
          ctest --output-on-failure -j $(nproc)
