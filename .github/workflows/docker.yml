name: Docker Image (CPU)

on:
  push:
    branches: ["master"]
    tags: ["OPALX-*"]
  pull_request:
    branches: ["master"]
    paths:
      - "docker/**"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/opalx-project/opalx

jobs:
  # ===== BUILD + SMOKE TESTS + PUBLISH =====
  # Pull requests only build and test; pushes to master and release tags also publish.
  cpu:
    name: Build, Test & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: GIT_SHA=${{ github.sha }}
          tags: opalx:test
          load: true

      - name: Get regression test inputs
        run: git clone --depth=1 https://github.com/OPALX-project/regression-tests-x.git

      - name: Run smoke regression tests
        run: docker/smoke-test.sh opalx:test regression-tests-x

      # master -> cpu, latest; tag OPALX-1.2.3 -> 1.2.3-cpu; every build -> sha-<short>-cpu
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=cpu,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=match,pattern=OPALX-(.*),group=1,suffix=-cpu
            type=sha,suffix=-cpu

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reuses the layers of the build above, so this does not compile again
      - name: Publish image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
