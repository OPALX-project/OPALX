include:
  - local: "ci/cscs/common.yml"

variables:
  ROCM6_3_UENV: "prgenv-gnu/25.07-6.3.3:v12"
  WITH_UENV_VIEW: "default"
  SCRATCH: "/capstor/scratch/cscs/biddisco"
  BUILD_ARCH: "gpu-rocm-mi300"
  CTEST_SITE: "Beverin mi300 ROCm 6.3.3"

# ---------------------------------------------------------
# Common settings for OPALX regression tests (ROCm / MI300)
# ---------------------------------------------------------
.opalx-regression-rocm-common:
  stage: opalx_regression
  extends: [.baremetal-runner-beverin-mi300]
  variables:
    SLURM_JOB_NUM_NODES: 1
    SLURM_NTASKS: 1
    SLURM_CPUS_PER_TASK: 8
    SLURM_TIMELIMIT: "0:30:00"
  before_script:
    - !reference [.pr-number-extractor, before_script]
    - echo "=== OPALX regression job (ROCm / MI300) starting ==="
    - pwd
    - date
    - export BUILD_PATH=$(pwd)/$BUILD_DIR
    - echo "BUILD_PATH=$BUILD_PATH"
    - export SRUN_ARGS="--uenv=${ROCM6_3_UENV} --view=${WITH_UENV_VIEW} --repo=${SCRATCH}/.uenv-images-ci-beverin --gpus-per-task=1"
    - echo "SRUN_ARGS=$SRUN_ARGS"
  script:
    - echo "=== Verify release build artifact ==="
    - ls -l $BUILD_PATH/bin/opalx
    - export LD_LIBRARY_PATH=$BUILD_PATH/lib:$LD_LIBRARY_PATH
    - export HSA_XNACK=1
    - export MALLOC_CHECK_=0
    - echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
    - echo "HSA_XNACK=$HSA_XNACK"

    - echo "=== Clone NightlyBuildX (main) ==="
    - git clone --depth 1 --branch main https://github.com/OPALX-project/NightlyBuildX.git nightlybuildx
    - ls nightlybuildx/scripts

    - echo "=== Clone regression tests (master) ==="
    - git clone --depth 1 --branch master https://github.com/OPALX-project/regression-tests-x.git regression-tests
    - ls regression-tests/RegressionTests

    - echo "=== Setup gnuplot ==="
    - |
      if command -v gnuplot &> /dev/null; then
        echo "gnuplot found at $(command -v gnuplot)"
      else
        echo "gnuplot not found, trying cached conda-forge environment"
        echo "SCRATCH=$SCRATCH"
        echo "PWD=$(pwd)"
        echo "UID=$(id -u)"
        # verify scratch is writable
        if ! touch "$SCRATCH/.ci_write_test_$$" 2>/dev/null; then
          echo "ERROR: $SCRATCH is not writable"
        else
          rm -f "$SCRATCH/.ci_write_test_$$"
          echo "OK: $SCRATCH is writable"
        fi
        GNUPLOT_ENV="$SCRATCH/gnuplot-env-$(uname -m)"
        MAMBA_ROOT_PREFIX="$SCRATCH/micromamba-root-$(uname -m)"
        export MAMBA_ROOT_PREFIX
        echo "GNUPLOT_ENV=$GNUPLOT_ENV"
        echo "MAMBA_ROOT_PREFIX=$MAMBA_ROOT_PREFIX"
        if [ ! -x "$GNUPLOT_ENV/bin/gnuplot" ]; then
          echo "Installing micromamba and gnuplot"
          MAMBA_DIR="$SCRATCH/micromamba-bin-$(uname -m)"
          mkdir -p "$MAMBA_DIR"
          case "$(uname -m)" in
            x86_64)  MAMBA_ARCH="linux-64" ;;
            aarch64) MAMBA_ARCH="linux-aarch64" ;;
            *)       echo "Unsupported arch $(uname -m), will skip plot generation"; MAMBA_ARCH="" ;;
          esac
          if [ -n "$MAMBA_ARCH" ]; then
            # Serialize downloads for the same architecture on the shared FS
            LOCK_FILE="$MAMBA_DIR.lock"
            (
              if command -v flock &> /dev/null; then
                flock -x 200
              fi
              if [ ! -x "$MAMBA_DIR/micromamba" ]; then
                echo "Downloading micromamba for $MAMBA_ARCH"
                rm -f "$MAMBA_DIR/micromamba"
                if ! curl -fsSL "https://micro.mamba.pm/api/micromamba/${MAMBA_ARCH}/latest" | tar -xvj -C "$MAMBA_DIR" --strip-components=1 bin/micromamba; then
                  echo "ERROR: failed to download/extract micromamba"
                fi
                chmod +x "$MAMBA_DIR/micromamba" 2>/dev/null || true
              fi
            ) 200>"$LOCK_FILE"
          fi
          # Copy to the job directory before executing. Shared scratch can
          # raise "Text file busy" if the cached binary is open for writing
          # (concurrent job) or on certain parallel filesystems.
          if [ -x "$MAMBA_DIR/micromamba" ]; then
            cp "$MAMBA_DIR/micromamba" ./micromamba
            chmod +x ./micromamba
            LOCAL_MAMBA="./micromamba"
          else
            LOCAL_MAMBA=""
          fi
          if [ -n "$LOCAL_MAMBA" ] && [ -x "$LOCAL_MAMBA" ]; then
            echo "micromamba version:"
            "$LOCAL_MAMBA" --version
            echo "Creating gnuplot environment (this may take a while on first run)"
            if ! "$LOCAL_MAMBA" create -y -p "$GNUPLOT_ENV" -c conda-forge gnuplot > /tmp/micromamba-gnuplot.log 2>&1; then
              echo "ERROR: micromamba create failed, log follows:"
              cat /tmp/micromamba-gnuplot.log
            else
              echo "micromamba create completed"
            fi
          else
            echo "ERROR: micromamba binary not found or not executable"
          fi
        fi
        echo "Environment contents:"
        ls -la "$GNUPLOT_ENV/bin" 2>/dev/null || echo "  (directory does not exist or is empty)"
        if [ -x "$GNUPLOT_ENV/bin/gnuplot" ]; then
          export PATH="$GNUPLOT_ENV/bin:$PATH"
          echo "gnuplot installed at $GNUPLOT_ENV/bin/gnuplot"
        else
          echo "WARNING: gnuplot binary not present after install attempt"
        fi
        if command -v gnuplot &> /dev/null; then
          echo "gnuplot now available at $(command -v gnuplot)"
          gnuplot --version
        else
          echo "WARNING: gnuplot could not be installed, regression plots will be skipped"
        fi
      fi

    - echo "=== Patch stattest.py to tolerate missing gnuplot ==="
    - python3 $CI_PROJECT_DIR/ci/cscs/patch-stattest.py nightlybuildx/scripts/OpalRegressionTests/stattest.py

    - echo "=== Install mpirun -> srun wrapper ==="
    - mkdir -p ci-bin
    - cp $CI_PROJECT_DIR/ci/cscs/regression-test-mpirun-wrapper ci-bin/mpirun
    - chmod +x ci-bin/mpirun
    - export PATH=$(pwd)/ci-bin:$PATH
    - which mpirun

    - echo "=== Patch run-reg-tests.py to fail CI on test failures ==="
    - |
      python3 - <<'PY'
      from pathlib import Path
      p = Path("nightlybuildx/scripts/run-reg-tests.py")
      s = p.read_text()
      old = "    rt.run()\n"
      new = "    rt.run()\n    if rt.totalNrPassed != rt.totalNrTests:\n        sys.exit(1)\n"
      if old not in s:
          raise SystemExit("ERROR: could not find rt.run() in run-reg-tests.py")
      p.write_text(s.replace(old, new, 1))
      print("Patched run-reg-tests.py to exit non-zero on test failures")
      PY

    - echo "=== Run regression tests ==="
    - >-
        python3 nightlybuildx/scripts/run-reg-tests.py
        --base-dir=$(pwd)/regression-tests/RegressionTests
        --opalx-exe-path=$BUILD_PATH/bin
        --publish-dir=$CI_PROJECT_DIR/regression-results-$BUILD_ARCH
        --timestamp=$CI_COMMIT_SHORT_SHA

    - echo "=== Regression tests finished ==="
    - ls -R $CI_PROJECT_DIR/regression-results-$BUILD_ARCH

    - echo "=== Push regression results to opal-live-doc ==="
    - |
      if [ -z "$PSI_GIT_SSHKEY" ]; then
        echo "WARNING: PSI_GIT_SSHKEY not set, skipping push"
      elif [ ! -d "$CI_PROJECT_DIR/regression-results-$BUILD_ARCH" ]; then
        echo "WARNING: No regression results found at $CI_PROJECT_DIR/regression-results-$BUILD_ARCH, skipping push"
      else
        mkdir -p ~/.ssh
        KEY_FILE=~/.ssh/opal_live_doc_key
        # CI variables often store multiline secrets with literal \n.
        # Use %b so escaped newlines become real newlines.
        printf '%b\n' "$PSI_GIT_SSHKEY" > "$KEY_FILE"
        chmod 600 "$KEY_FILE"
        # If the file does not look like a private key, try base64 decoding.
        if ! grep -q '^-----BEGIN .* PRIVATE KEY-----' "$KEY_FILE"; then
          echo "Key not in PEM format, trying base64 decode"
          printf '%s\n' "$PSI_GIT_SSHKEY" | base64 -d > "$KEY_FILE" 2>/dev/null
          chmod 600 "$KEY_FILE"
          if ! grep -q '^-----BEGIN .* PRIVATE KEY-----' "$KEY_FILE"; then
            echo "ERROR: PSI_GIT_SSHKEY does not contain a valid SSH private key"
            echo "Key length: ${#PSI_GIT_SSHKEY}"
            echo "First 80 chars: ${PSI_GIT_SSHKEY:0:80}"
            echo "Last 40 chars: ${PSI_GIT_SSHKEY: -40}"
            exit 1
          fi
        fi
        ssh-keyscan -t rsa,ecdsa,ed25519 gitea.psi.ch >> ~/.ssh/known_hosts 2>/dev/null
        export GIT_SSH_COMMAND="ssh -i $KEY_FILE -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes"
        git config --global user.email "opalx-ci@cscs.ch"
        git config --global user.name "OPALX CI"
        if git clone --depth 1 git@gitea.psi.ch:AMAS/opal-live-doc.git opal-live-doc; then
          mkdir -p opal-live-doc/$BUILD_ARCH
          cp -r $CI_PROJECT_DIR/regression-results-$BUILD_ARCH/. opal-live-doc/$BUILD_ARCH/
          cd opal-live-doc
          git add -A
          git commit -m "Update $BUILD_ARCH regression results for $CI_COMMIT_SHORT_SHA" || echo "Nothing to commit"
          git push origin HEAD:main || echo "WARNING: push failed"
        else
          echo "WARNING: clone failed, cannot push regression results"
        fi
      fi
  artifacts:
    paths:
      - regression-results-$BUILD_ARCH
    expire_in: 1 week

# ---------------------------------------------------------
# rocm mi300 regression release
# ---------------------------------------------------------
opalx-regression-rocm6_3-mi300-release:
  extends: .opalx-regression-rocm-common
  needs: ["opalx-build-rocm6_3-release"]
  variables:
    BUILD_DIR: "build-$CI_COMMIT_SHORT_SHA-release"
    BUILD_TYPE: Release
