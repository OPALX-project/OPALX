# Common OPALX regression test job template.
#
# Arch-specific files should define:
#   BUILD_ARCH   - architecture identifier (must match the config's architecture)
#   REGTEST_CONFIG - filename under ci/cscs/config/ passed to NightlyBuildX run_tests
#   CTEST_SITE   - site name for diagnostics
#   SRUN_ARGS    - srun arguments used by the mpirun wrapper
#   WRAPPER      - optional extra wrapper binary (empty/unset if none)

.opalx-regression-common:
  stage: opalx_regression
  variables:
    SLURM_JOB_NUM_NODES: 1
    SLURM_NTASKS: 1
    SLURM_TIMELIMIT: "0:30:00"
    SCRATCH: "/capstor/scratch/cscs/biddisco"
  before_script:
    - !reference [.pr-number-extractor, before_script]
    - echo "=== OPALX regression job ($BUILD_ARCH) starting ==="
    - pwd
    - date
    - export BUILD_PATH=$(pwd)/$BUILD_DIR
    - echo "BUILD_PATH=$BUILD_PATH"
    - echo "SRUN_ARGS=$SRUN_ARGS"
    - |
      # Normalize the published branch name. CSCS CI creates a separate merge
      # pipeline with a ref like __CSCSCI__pr486; publish those as pr-486 so
      # they do not collide with the source branch pipeline.
      if [[ "$CI_COMMIT_REF_NAME" =~ __CSCSCI__pr([0-9]+) ]]; then
        export OPALX_PUBLISH_BRANCH="pr-${BASH_REMATCH[1]}"
      elif [ "$CI_COMMIT_REF_NAME" = "master" ]; then
        export OPALX_PUBLISH_BRANCH="master"
      else
        export OPALX_PUBLISH_BRANCH=""
      fi
      echo "OPALX_PUBLISH_BRANCH=$OPALX_PUBLISH_BRANCH"
  script:
    - echo "=== Verify release build artifact ==="
    - ls -l $BUILD_PATH/bin/
    - export LD_LIBRARY_PATH=$BUILD_PATH/lib:$LD_LIBRARY_PATH
    - export MALLOC_CHECK_=0
    - echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"

    - echo "=== Fix ctest paths from build dir to test dir ==="
    - CACHE_DIR=$(grep "CMAKE_CACHEFILE_DIR:INTERNAL=" $BUILD_PATH/CMakeCache.txt | cut -d'=' -f2)
    - echo "Replacing cache_dir $CACHE_DIR with build_dir $BUILD_PATH"
    - find $BUILD_PATH -type f -name "CTestTestfile.cmake" -exec sed -i "s|$CACHE_DIR|$BUILD_PATH|g" {} \;
    - find $BUILD_PATH -type f -name "DartConfiguration.tcl" -exec sed -i "s|$CACHE_DIR|$BUILD_PATH|g" {} \;

    - echo "=== Install NightlyBuildX tools (matplotlib, pandoc, xsltproc, perl) ==="
    - |
      TOOLS_ENV="$SCRATCH/nightlybuildx-tools-$(uname -m)"
      MAMBA_ROOT_PREFIX="$SCRATCH/micromamba-root-$(uname -m)"
      export MAMBA_ROOT_PREFIX
      if [ ! -x "$TOOLS_ENV/bin/python3" ] || [ ! -x "$TOOLS_ENV/bin/pandoc" ] || [ ! -x "$TOOLS_ENV/bin/xsltproc" ]; then
        MAMBA_DIR="$SCRATCH/micromamba-bin-$(uname -m)"
        mkdir -p "$MAMBA_DIR"
        case "$(uname -m)" in
          x86_64)  MAMBA_ARCH="linux-64" ;;
          aarch64) MAMBA_ARCH="linux-aarch64" ;;
          *)       echo "Unsupported arch $(uname -m)"; MAMBA_ARCH="" ;;
        esac
        if [ -n "$MAMBA_ARCH" ]; then
          LOCK_FILE="$MAMBA_DIR.lock"
          (
            if command -v flock &> /dev/null; then
              flock -x 200
            fi
            if [ ! -x "$MAMBA_DIR/micromamba" ]; then
              echo "Downloading micromamba for $MAMBA_ARCH"
              rm -f "$MAMBA_DIR/micromamba"
              curl -fsSL "https://micro.mamba.pm/api/micromamba/${MAMBA_ARCH}/latest" | tar -xvj -C "$MAMBA_DIR" --strip-components=1 bin/micromamba
              chmod +x "$MAMBA_DIR/micromamba" 2>/dev/null || true
            fi
          ) 200>"$LOCK_FILE"
        fi
        if [ -x "$MAMBA_DIR/micromamba" ]; then
          cp "$MAMBA_DIR/micromamba" ./micromamba
          chmod +x ./micromamba
          echo "Installing NightlyBuildX tools into $TOOLS_ENV"
          if ! ./micromamba create -y -p "$TOOLS_ENV" -c conda-forge python matplotlib pandoc libxslt perl > /tmp/micromamba-tools.log 2>&1; then
            echo "ERROR: micromamba create failed, log follows:"
            cat /tmp/micromamba-tools.log
            exit 1
          fi
        else
          echo "ERROR: micromamba binary not available"
          exit 1
        fi
      fi
      export PATH="$TOOLS_ENV/bin:$PATH"
      export LD_LIBRARY_PATH="$TOOLS_ENV/lib:$LD_LIBRARY_PATH"
      python3 -c "import matplotlib; print('matplotlib', matplotlib.__version__)"
      pandoc --version | head -1
      xsltproc --version | head -1
      perl --version | head -2

    - echo "=== Clone NightlyBuildX (local-summary-nogpl) ==="
    - git clone --depth 1 --branch local-summary-nogpl https://github.com/OPALX-project/NightlyBuildX.git nightlybuildx
    - ls nightlybuildx/scripts

    - echo "=== Patch run_tests to skip salloc (not available inside CSCS CI allocations) ==="
    - |
      sed -i 's|if command -v salloc >/dev/null 2>&1 && sinfo >/dev/null 2>&1; then|if false; then|' nightlybuildx/scripts/run_tests
      grep -n "if false; then" nightlybuildx/scripts/run_tests

    - echo "=== Patch run-reg-tests.py to fail CI on test failures ==="
    - |
      python3 - <<'PY'
      from pathlib import Path
      p = Path("nightlybuildx/scripts/run-reg-tests.py")
      s = p.read_text()
      old = "    rt.run(compare_only=args.run_local_now)\n"
      new = "    rt.run(compare_only=args.run_local_now)\n    if rt.totalNrPassed != rt.totalNrTests:\n        sys.exit(1)\n"
      if old not in s:
          raise SystemExit("ERROR: could not find rt.run() in run-reg-tests.py")
      p.write_text(s.replace(old, new, 1))
      print("Patched run-reg-tests.py to exit non-zero on test failures")
      PY

    - echo "=== Install mpirun -> srun wrapper ==="
    - mkdir -p ci-bin
    - cp $CI_PROJECT_DIR/ci/cscs/regression-test-mpirun-wrapper ci-bin/mpirun
    - chmod +x ci-bin/mpirun
    - export PATH=$(pwd)/ci-bin:$PATH
    - which mpirun

    - echo "=== Run regression and unit tests via NightlyBuildX ==="
    - >-
      bash nightlybuildx/scripts/run_tests
      --config=$CI_PROJECT_DIR/ci/cscs/config/$REGTEST_CONFIG
      --opalx-exe-path=$BUILD_PATH/bin
      --opalx-build-dir=$BUILD_PATH
      --opalx-branch=${OPALX_PUBLISH_BRANCH:-$CI_COMMIT_REF_NAME}
      --reg-tests
      --unit-tests
      --no-gpl
      --publish-dir=$CI_PROJECT_DIR/regression-results-$BUILD_ARCH

    - echo "=== Regression tests finished ==="
    - find $CI_PROJECT_DIR/regression-results-$BUILD_ARCH -type f | sort

    - echo "=== Push regression results to opal-live-doc ==="
    - |
      if [ -z "$PSI_GIT_SSHKEY" ]; then
        echo "WARNING: PSI_GIT_SSHKEY not set, skipping push"
      elif [ ! -d "$CI_PROJECT_DIR/regression-results-$BUILD_ARCH" ]; then
        echo "WARNING: No regression results found at $CI_PROJECT_DIR/regression-results-$BUILD_ARCH, skipping push"
      elif [ -z "$OPALX_PUBLISH_BRANCH" ]; then
        echo "Skipping opal-live-doc push for feature branch $CI_COMMIT_REF_NAME"
      else
        mkdir -p ~/.ssh
        KEY_FILE=~/.ssh/opal_live_doc_key
        python3 - "$PSI_GIT_SSHKEY" > "$KEY_FILE" <<'PY'
      import re, sys
      raw = sys.argv[1]
      clean = re.sub(r'\s+', '', raw)
      m = re.search(r'-----BEGIN([A-Z\s]+)PRIVATEKEY-----(.+?)-----END\1PRIVATEKEY-----', clean)
      if m:
          key_type = m.group(1).strip()
          b64 = m.group(2)
      else:
          key_type = "OPENSSH"
          b64 = clean
      pem = f"-----BEGIN {key_type} PRIVATE KEY-----\n"
      pem += "\n".join(b64[i:i+64] for i in range(0, len(b64), 64))
      pem += f"\n-----END {key_type} PRIVATE KEY-----\n"
      print(pem)
      PY
        chmod 600 "$KEY_FILE"
        if ! ssh-keygen -y -f "$KEY_FILE" < /dev/null > /dev/null 2>&1; then
          echo "ERROR: Could not validate SSH private key"
          exit 1
        fi
        ssh-keyscan -t rsa,ecdsa,ed25519 gitea.psi.ch >> ~/.ssh/known_hosts 2>/dev/null
        export GIT_SSH_COMMAND="ssh -i $KEY_FILE -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -o BatchMode=yes"
        git config --global user.email "opalx-ci@cscs.ch"
        git config --global user.name "OPALX CI"
        if git clone --depth 1 --filter=blob:none --no-checkout --branch master git@gitea.psi.ch:AMAS/opal-live-doc.git opal-live-doc; then
          cd opal-live-doc
          git sparse-checkout init --cone
          git sparse-checkout set docs/opalx-regression-test/
          git checkout
           # Helper that (re)creates the commit for this architecture on top of
          # the currently checked-out origin/master.  It is invoked at the start
          # of the loop and again after every failed push so that we never
          # leave an abandoned commit behind and the master overview page is
          # always rebuilt from the latest state of all architectures.
          regenerate_and_commit() {
            git fetch origin master
            git reset --hard origin/master
            mkdir -p docs/opalx-regression-test
            cp -r $CI_PROJECT_DIR/regression-results-$BUILD_ARCH/* docs/opalx-regression-test/
            TOOLS_ENV="$SCRATCH/nightlybuildx-tools-$(uname -m)"
            export PATH="$TOOLS_ENV/bin:$PATH"
            export LD_LIBRARY_PATH="$TOOLS_ENV/lib:$LD_LIBRARY_PATH"
            bash $CI_PROJECT_DIR/nightlybuildx/scripts/run_tests \
              --do-not-compile-run \
              --publish-dir=$(pwd)/docs/opalx-regression-test \
              --opalx-branch=$OPALX_PUBLISH_BRANCH \
              --config=$CI_PROJECT_DIR/ci/cscs/config/$REGTEST_CONFIG
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Update $BUILD_ARCH regression results for $CI_COMMIT_SHORT_SHA"
            else
              echo "No changes to commit after regenerating"
            fi
          }

          for attempt in 1 2 3 4 5; do
            regenerate_and_commit
            if git push origin master; then
              echo "Push succeeded on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "ERROR: push failed after $attempt attempts"
              exit 1
            fi
            echo "WARNING: push failed on attempt $attempt (likely concurrent update), retrying..."
            sleep $((attempt * 5))
          done
        else
          echo "WARNING: clone failed, cannot push regression results"
        fi
      fi
  artifacts:
    paths:
      - regression-results-$BUILD_ARCH
    expire_in: 1 week
