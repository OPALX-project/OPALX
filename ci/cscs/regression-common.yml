# Common OPALX regression test job template.
#
# Runs the unit tests and the regression-tests-x suite with tools/regtest.sh from the results
# repository AMAS/opalx-regression and publishes master and PR runs there. Its Pages build shows
# them at https://amas.pages.psi.ch/opalx-regression/. See ci/cscs/REGRESSION-PIPELINE.md.
#
# Arch-specific files should define:
#   BUILD_ARCH   - architecture name on the results site (e.g. gpu-cuda-gh200)
#   CTEST_SITE   - site name for diagnostics
#   SRUN_ARGS    - srun arguments used by the launcher wrapper
#   WRAPPER      - optional extra wrapper binary (empty/unset if none)

.opalx-regression-common:
  stage: opalx_regression
  variables:
    SLURM_JOB_NUM_NODES: 1
    SLURM_NTASKS: 1
    SLURM_TIMELIMIT: "0:45:00"
    SCRATCH: "/capstor/scratch/cscs/biddisco"
    RESULTS_REPO: "git@gitea.psi.ch:AMAS/opalx-regression.git"
    RESULTS_TOOLS_REF: "main"
  before_script:
    - !reference [.pr-number-extractor, before_script]
    - echo "=== OPALX regression job ($BUILD_ARCH) starting ==="
    - pwd
    - date
    - export BUILD_PATH=$(pwd)/$BUILD_DIR
    - echo "BUILD_PATH=$BUILD_PATH"
    - echo "SRUN_ARGS=$SRUN_ARGS"
    - |
      # Normalize the published branch name. CSCS CI creates a separate merge
      # pipeline with a ref like __CSCSCI__pr486; publish those as pr-486 so
      # they do not collide with the source branch pipeline.
      if [[ "$CI_COMMIT_REF_NAME" =~ __CSCSCI__pr([0-9]+) ]]; then
        export OPALX_PUBLISH_BRANCH="pr-${BASH_REMATCH[1]}"
      elif [ "$CI_COMMIT_REF_NAME" = "master" ]; then
        export OPALX_PUBLISH_BRANCH="master"
      else
        export OPALX_PUBLISH_BRANCH=""
      fi
      echo "OPALX_PUBLISH_BRANCH=$OPALX_PUBLISH_BRANCH"
    - |
      # Fetch the PR title from GitHub so the results site shows
      # "pr-508 CI CD and regression testing fixes at CSCS" instead of
      # just "pr-508".  The repos are public so no token is needed.
      if [[ -n "$OPALX_PUBLISH_BRANCH" && "$OPALX_PUBLISH_BRANCH" =~ ^pr-([0-9]+)$ ]]; then
        PR_NUM="${BASH_REMATCH[1]}"
        echo "Fetching PR title for #$PR_NUM from GitHub..."
        PR_TITLE=$(curl -fsSL "https://api.github.com/repos/OPALX-project/OPALX/pulls/${PR_NUM}" \
          | python3 -c "import json,sys; print(json.load(sys.stdin)['title'])" 2>/dev/null || true)
        if [[ -n "$PR_TITLE" ]]; then
          export OPALX_PUBLISH_BRANCH="${OPALX_PUBLISH_BRANCH} ${PR_TITLE}"
          echo "OPALX_PUBLISH_BRANCH (with title)=$OPALX_PUBLISH_BRANCH"
        else
          echo "WARNING: could not fetch PR title for #$PR_NUM, using branch name only"
        fi
      fi
    - |
      # The results site groups runs by this name. Same rule as NightlyBuildX used, so new runs
      # join the imported ones (e.g. pr-508_CI_CD_and_regression_testing_fixes_at_CSCS).
      RUN_BRANCH="${OPALX_PUBLISH_BRANCH:-$CI_COMMIT_REF_NAME}"
      export RUN_BRANCH="${RUN_BRANCH//[^A-Za-z0-9._-]/_}"
      echo "RUN_BRANCH=$RUN_BRANCH"
  script:
    - echo "=== Verify release build artifact ==="
    - ls -l $BUILD_PATH/bin/
    - export LD_LIBRARY_PATH=$BUILD_PATH/lib:$LD_LIBRARY_PATH
    - export MALLOC_CHECK_=0
    - echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"

    - echo "=== Fix ctest paths from build dir to test dir ==="
    - CACHE_DIR=$(grep "CMAKE_CACHEFILE_DIR:INTERNAL=" $BUILD_PATH/CMakeCache.txt | cut -d'=' -f2)
    - echo "Replacing cache_dir $CACHE_DIR with build_dir $BUILD_PATH"
    - find $BUILD_PATH -type f -name "CTestTestfile.cmake" -exec sed -i "s|$CACHE_DIR|$BUILD_PATH|g" {} \;
    - find $BUILD_PATH -type f -name "DartConfiguration.tcl" -exec sed -i "s|$CACHE_DIR|$BUILD_PATH|g" {} \;

    - echo "=== Install the PSI Gitea key (PSI_GIT_SSHKEY) ==="
    - |
      if [ -z "$PSI_GIT_SSHKEY" ]; then
        echo "ERROR: PSI_GIT_SSHKEY is not set; it is needed to fetch the tools from $RESULTS_REPO"
        exit 1
      fi
      mkdir -p ~/.ssh
      timeout 10 bash -c 'cat < /dev/null > /dev/tcp/gitea.psi.ch/22' \
        && echo "Pre-flight check: gitea.psi.ch port 22 is reachable" \
        || echo "ERROR: gitea.psi.ch port 22 is UNREACHABLE from this node (SSH egress blocked?)"
      KEY_FILE=~/.ssh/psi_gitea_key
      python3 - "$PSI_GIT_SSHKEY" > "$KEY_FILE" <<'PY'
      import re, sys
      raw = sys.argv[1]
      clean = re.sub(r'\s+', '', raw)
      m = re.search(r'-----BEGIN([A-Z\s]+)PRIVATEKEY-----(.+?)-----END\1PRIVATEKEY-----', clean)
      if m:
          key_type = m.group(1).strip()
          b64 = m.group(2)
      else:
          key_type = "OPENSSH"
          b64 = clean
      pem = f"-----BEGIN {key_type} PRIVATE KEY-----\n"
      pem += "\n".join(b64[i:i+64] for i in range(0, len(b64), 64))
      pem += f"\n-----END {key_type} PRIVATE KEY-----\n"
      print(pem)
      PY
      chmod 600 "$KEY_FILE"
      if ! ssh-keygen -y -f "$KEY_FILE" < /dev/null > /dev/null 2>&1; then
        echo "ERROR: Could not validate SSH private key"
        exit 1
      fi
      # The public key is not secret; it is printed so it can be added to a repository as a deploy key.
      echo "Public key: $(ssh-keygen -y -f "$KEY_FILE" < /dev/null)"
      echo "Key fingerprint: $(ssh-keygen -l -f "$KEY_FILE")"
      if ssh-keyscan -T 10 -t rsa,ecdsa,ed25519 gitea.psi.ch >> ~/.ssh/known_hosts; then
        echo "ssh-keyscan: added gitea.psi.ch host keys to known_hosts"
      else
        echo "WARNING: ssh-keyscan failed to reach gitea.psi.ch - SSH connectivity may be blocked"
      fi
      export GIT_SSH_COMMAND="ssh -i $KEY_FILE -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -o BatchMode=yes"
      git config --global user.email "opalx-ci@cscs.ch"
      git config --global user.name "OPALX CI"
      git --version
      # Gitea names the key and says whether it is a user key or a deploy key.
      $GIT_SSH_COMMAND -T git@gitea.psi.ch < /dev/null || true

    - echo "=== Fetch the tools of the results repository ==="
    - |
      rm -rf opalx-regression
      if ! timeout 120 git clone --depth 1 --filter=blob:none --no-checkout --branch "$RESULTS_TOOLS_REF" "$RESULTS_REPO" opalx-regression; then
        echo "ERROR: the key in PSI_GIT_SSHKEY cannot read $RESULTS_REPO."
        echo "Add the public key printed above to AMAS/opalx-regression as a deploy key with write access."
        exit 1
      fi
      git -C opalx-regression sparse-checkout init --cone
      git -C opalx-regression sparse-checkout set tools
      git -C opalx-regression checkout --quiet "$RESULTS_TOOLS_REF"
      git -C opalx-regression log -1 --format='tools at %h: %s'
      # Publishing needs write access. A dry-run push of a new branch checks it now, so a key
      # without it shows up in the first minute instead of after the tests.
      if timeout 60 git -C opalx-regression push --dry-run origin HEAD:refs/heads/ci-write-check; then
        echo "The key can push to $RESULTS_REPO"
      else
        echo "WARNING: the key can read but not push to $RESULTS_REPO; publishing at the end of this job will fail"
      fi

    - echo "=== Install Python and ctest for the tools ==="
    - |
      # regtest.sh needs Python 3.9 or newer and ctest 3.21 or newer (--output-junit). The tools
      # environment is kept on scratch and only rebuilt when it is missing or broken.
      TOOLS_ENV="$SCRATCH/opalx-regtest-tools-$(uname -m)"
      MAMBA_ROOT_PREFIX="$SCRATCH/micromamba-root-$(uname -m)"
      export MAMBA_ROOT_PREFIX
      if [ ! -x "$TOOLS_ENV/bin/python3" ] || ! "$TOOLS_ENV/bin/python3" -c "import site" 2>/dev/null || [ ! -x "$TOOLS_ENV/bin/ctest" ]; then
        echo "Tools environment is missing or broken, recreating $TOOLS_ENV"
        rm -rf "$TOOLS_ENV"
        MAMBA_DIR="$SCRATCH/micromamba-bin-$(uname -m)"
        mkdir -p "$MAMBA_DIR"
        case "$(uname -m)" in
          x86_64)  MAMBA_ARCH="linux-64" ;;
          aarch64) MAMBA_ARCH="linux-aarch64" ;;
          *)       echo "Unsupported arch $(uname -m)"; MAMBA_ARCH="" ;;
        esac
        if [ -n "$MAMBA_ARCH" ]; then
          LOCK_FILE="$MAMBA_DIR.lock"
          (
            if command -v flock &> /dev/null; then
              flock -x 200
            fi
            if [ ! -x "$MAMBA_DIR/micromamba" ]; then
              echo "Downloading micromamba for $MAMBA_ARCH"
              rm -f "$MAMBA_DIR/micromamba"
              curl -fsSL "https://micro.mamba.pm/api/micromamba/${MAMBA_ARCH}/latest" | tar -xvj -C "$MAMBA_DIR" --strip-components=1 bin/micromamba
              chmod +x "$MAMBA_DIR/micromamba" 2>/dev/null || true
            fi
          ) 200>"$LOCK_FILE"
        fi
        if [ -x "$MAMBA_DIR/micromamba" ]; then
          cp "$MAMBA_DIR/micromamba" ./micromamba
          chmod +x ./micromamba
          echo "Installing python and cmake into $TOOLS_ENV"
          if ! ./micromamba create -y -p "$TOOLS_ENV" -c conda-forge python cmake > /tmp/micromamba-tools.log 2>&1; then
            echo "ERROR: micromamba create failed, log follows:"
            cat /tmp/micromamba-tools.log
            exit 1
          fi
        else
          echo "ERROR: micromamba binary not available"
          exit 1
        fi
      fi
      # The environment's binaries find their libraries by RPATH; LD_LIBRARY_PATH stays as it is
      # so that srun, git and ssh keep the system libraries.
      export PATH="$TOOLS_ENV/bin:$PATH"
      python3 --version
      ctest --version | head -1

    - echo "=== Clone regression-tests-x (master) ==="
    - rm -rf regression-tests-x
    - git clone --depth 1 https://github.com/OPALX-project/regression-tests-x.git regression-tests-x
    - git -C regression-tests-x log -1 --format='regression-tests-x at %h - %s'

    - echo "=== Run unit and regression tests with regtest.sh ==="
    # regtest.sh exits 3 when tests fail. Capture the exit code so the run is
    # still published below; the job is failed with it at the end of the script.
    # Each test runs in a copy under TMPDIR, which is put on scratch instead of the node's /tmp.
    - export REGTEST_EXIT=0
    - export RESULTS_DIR=$CI_PROJECT_DIR/regression-results-$BUILD_ARCH
    - export TMPDIR=$CI_PROJECT_DIR/regtest-tmp
    - mkdir -p $TMPDIR
    - >-
      bash opalx-regression/tools/regtest.sh
      --arch "$BUILD_ARCH"
      --build "$BUILD_PATH"
      --source "$CI_PROJECT_DIR"
      --tests regression-tests-x
      --branch "$RUN_BRANCH"
      --launcher "$CI_PROJECT_DIR/ci/cscs/regression-test-mpirun-wrapper -np {ranks}"
      --timeout 1200
      --out "$RESULTS_DIR"
      || export REGTEST_EXIT=$?

    - echo "=== Regression tests finished (regtest.sh exit code $REGTEST_EXIT) ==="
    - find $RESULTS_DIR -type f | sort || true

    - echo "=== Publish the run to the results repository ==="
    - |
      RUN_JSON=$(find "$RESULTS_DIR/runs" -name run.json 2>/dev/null | head -1 || true)
      if [ -z "$OPALX_PUBLISH_BRANCH" ]; then
        echo "Not publishing feature branch $CI_COMMIT_REF_NAME; the run is in the job artifacts"
      elif [ -z "$RUN_JSON" ]; then
        echo "ERROR: regtest.sh packed no run (exit code $REGTEST_EXIT), nothing to publish"
      else
        bash opalx-regression/tools/publish_run.sh "$(dirname "$RUN_JSON")" "$RESULTS_REPO"
        echo "The site shows the run after its Pages build: https://amas.pages.psi.ch/opalx-regression/results/"
      fi

    - |
      if [ "$REGTEST_EXIT" -ne 0 ]; then
        echo "ERROR: regtest.sh failed (exit code $REGTEST_EXIT, 3 = tests failed); failing job"
        exit "$REGTEST_EXIT"
      fi
  artifacts:
    when: always
    paths:
      - regression-results-$BUILD_ARCH
    expire_in: 1 week
