include:
  - local: "ci/cscs/common.yml"

variables:
  EIGER_UENV: "prgenv-gnu/25.6:v2"
  WITH_UENV_VIEW: "default"
  WRAPPER: ""
  SCRATCH: "/capstor/scratch/cscs/biddisco"
  BUILD_ARCH: "cpu-zen2-openmp"
  CTEST_SITE: "Eiger OpenMP"

# ---------------------------------------------------------
# Common settings for OPALX regression tests (OpenMP)
# ---------------------------------------------------------
.opalx-regression-openmp-common:
  stage: opalx_regression
  extends: [.baremetal-runner-eiger-zen2]
  variables:
    SLURM_JOB_NUM_NODES: 1
    SLURM_NTASKS: 1
    SLURM_CPUS_PER_TASK: 64
    SLURM_TIMELIMIT: "0:30:00"
  before_script:
    - !reference [.pr-number-extractor, before_script]
    - echo "=== OPALX regression job (OpenMP) starting ==="
    - pwd
    - date
    - export BUILD_PATH=$(pwd)/$BUILD_DIR
    - echo "BUILD_PATH=$BUILD_PATH"
    - export SRUN_ARGS="--uenv=${EIGER_UENV} --view=${WITH_UENV_VIEW} --repo=${SCRATCH}/.uenv-images-ci-eiger"
    - echo "SRUN_ARGS=$SRUN_ARGS"
  script:
    - echo "=== Verify release build artifact ==="
    - ls -l $BUILD_PATH/bin/opalx
    - export LD_LIBRARY_PATH=$BUILD_PATH/lib:$LD_LIBRARY_PATH
    - export MALLOC_CHECK_=0
    - echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"

    - echo "=== Clone NightlyBuildX (main) ==="
    - git clone --depth 1 --branch main https://github.com/OPALX-project/NightlyBuildX.git nightlybuildx
    - ls nightlybuildx/scripts

    - echo "=== Clone regression tests (master) ==="
    - git clone --depth 1 --branch master https://github.com/OPALX-project/regression-tests-x.git regression-tests
    - ls regression-tests/RegressionTests

    - echo "=== Setup gnuplot ==="
    - |
      if command -v gnuplot &> /dev/null; then
        echo "gnuplot found at $(command -v gnuplot)"
      else
        echo "gnuplot not found, trying cached conda-forge environment"
        GNUPLOT_ENV="$SCRATCH/gnuplot-env-$(uname -m)"
        if [ ! -d "$GNUPLOT_ENV/bin" ]; then
          echo "Installing micromamba and gnuplot"
          mkdir -p "$SCRATCH/micromamba-bin"
          case "$(uname -m)" in
            x86_64)  MAMBA_ARCH="linux-64" ;;
            aarch64) MAMBA_ARCH="linux-aarch64" ;;
            *)       echo "Unsupported arch $(uname -m), will skip plot generation"; MAMBA_ARCH="" ;;
          esac
          if [ -n "$MAMBA_ARCH" ] && [ ! -f "$SCRATCH/micromamba-bin/micromamba" ]; then
            curl -fsSL "https://micro.mamba.pm/api/micromamba/${MAMBA_ARCH}/latest" | tar -xvj -C "$SCRATCH/micromamba-bin" bin/micromamba || true
          fi
          if [ -f "$SCRATCH/micromamba-bin/micromamba" ]; then
            "$SCRATCH/micromamba-bin/micromamba" create -y -p "$GNUPLOT_ENV" -c conda-forge gnuplot || true
          fi
        fi
        if [ -d "$GNUPLOT_ENV/bin" ]; then
          export PATH="$GNUPLOT_ENV/bin:$PATH"
        fi
        if command -v gnuplot &> /dev/null; then
          echo "gnuplot now available at $(command -v gnuplot)"
        else
          echo "WARNING: gnuplot could not be installed, regression plots will be skipped"
        fi
      fi

    - echo "=== Patch stattest.py to tolerate missing gnuplot ==="
    - python3 $CI_PROJECT_DIR/ci/cscs/patch-stattest.py nightlybuildx/scripts/OpalRegressionTests/stattest.py

    - echo "=== Install mpirun -> srun wrapper ==="
    - mkdir -p ci-bin
    - cp $CI_PROJECT_DIR/ci/cscs/regression-test-mpirun-wrapper ci-bin/mpirun
    - chmod +x ci-bin/mpirun
    - export PATH=$(pwd)/ci-bin:$PATH
    - which mpirun

    - echo "=== Patch run-reg-tests.py to fail CI on test failures ==="
    - |
      python3 - <<'PY'
      from pathlib import Path
      p = Path("nightlybuildx/scripts/run-reg-tests.py")
      s = p.read_text()
      old = "    rt.run()\n"
      new = "    rt.run()\n    if rt.totalNrPassed != rt.totalNrTests:\n        sys.exit(1)\n"
      if old not in s:
          raise SystemExit("ERROR: could not find rt.run() in run-reg-tests.py")
      p.write_text(s.replace(old, new, 1))
      print("Patched run-reg-tests.py to exit non-zero on test failures")
      PY

    - echo "=== Run regression tests ==="
    - >-
        python3 nightlybuildx/scripts/run-reg-tests.py
        --base-dir=$(pwd)/regression-tests/RegressionTests
        --opalx-exe-path=$BUILD_PATH/bin
        --publish-dir=$CI_PROJECT_DIR/regression-results-$BUILD_ARCH
        --timestamp=$CI_COMMIT_SHORT_SHA

    - echo "=== Regression tests finished ==="
    - ls -R $CI_PROJECT_DIR/regression-results-$BUILD_ARCH

    - echo "=== Push regression results to opal-live-doc ==="
    - |
      if [ -z "$PSI_GIT_SSHKEY" ]; then
        echo "WARNING: PSI_GIT_SSHKEY not set, skipping push"
      elif [ ! -d "$CI_PROJECT_DIR/regression-results-$BUILD_ARCH" ]; then
        echo "WARNING: No regression results found at $CI_PROJECT_DIR/regression-results-$BUILD_ARCH, skipping push"
      else
        mkdir -p ~/.ssh
        printf '%s\n' "$PSI_GIT_SSHKEY" > ~/.ssh/opal_live_doc_key
        chmod 600 ~/.ssh/opal_live_doc_key
        ssh-keyscan -t rsa,ecdsa,ed25519 gitea.psi.ch >> ~/.ssh/known_hosts 2>/dev/null
        export GIT_SSH_COMMAND="ssh -i ~/.ssh/opal_live_doc_key -o StrictHostKeyChecking=accept-new"
        git config --global user.email "opalx-ci@cscs.ch"
        git config --global user.name "OPALX CI"
        git clone --depth 1 git@gitea.psi.ch:AMAS/opal-live-doc.git opal-live-doc
        mkdir -p opal-live-doc/$BUILD_ARCH
        cp -r $CI_PROJECT_DIR/regression-results-$BUILD_ARCH/. opal-live-doc/$BUILD_ARCH/
        cd opal-live-doc
        git add -A
        git commit -m "Update $BUILD_ARCH regression results for $CI_COMMIT_SHORT_SHA" || echo "Nothing to commit"
        git push origin HEAD:main
      fi
  artifacts:
    paths:
      - regression-results-$BUILD_ARCH
    expire_in: 1 week

# ---------------------------------------------------------
# openmp regression release
# ---------------------------------------------------------
opalx-regression-openmp-release:
  extends: .opalx-regression-openmp-common
  needs: ["opalx-build-openmp-release"]
  variables:
    BUILD_DIR: "build-$CI_COMMIT_SHORT_SHA-release"
    BUILD_TYPE: Release
