include:
  - local: "ci/cscs/common.yml"
  - local: "ci/cscs/regression-common.yml"

variables:
  EIGER_UENV: "prgenv-gnu/25.6:v2"
  BUILD_ARCH: "cpu-zen2-openmp"
  REGTEST_CONFIG: "openmp.conf"
  CTEST_SITE: "Eiger OpenMP"
  SRUN_ARGS: "--uenv=${EIGER_UENV} --view=${WITH_UENV_VIEW} --repo=${SCRATCH}/.uenv-images-ci-eiger"
  WRAPPER: ""

# ---------------------------------------------------------
# Common settings for OPALX regression tests (OpenMP)
# ---------------------------------------------------------
.opalx-regression-openmp-common:
  extends:
    - .opalx-regression-common
    - .baremetal-runner-eiger-zen2
  variables:
    SLURM_CPUS_PER_TASK: 64

# ---------------------------------------------------------
# openmp regression release
# ---------------------------------------------------------
opalx-regression-openmp-release:
  extends: .opalx-regression-openmp-common
  needs: ["opalx-build-openmp-release"]
  variables:
    BUILD_DIR: "build-$CI_COMMIT_SHORT_SHA-release"
    BUILD_TYPE: Release
